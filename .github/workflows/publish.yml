name: Publish Self-Host Image

on:
  push:
    tags: ['self-host-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./self-hosting
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/trylag/lag:latest
            ghcr.io/trylag/lag:${{ github.ref_name }}

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^self-host-v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            PR_LIST=$(gh pr list --state merged --base main --search "merged:>=$(git log -1 --format=%aI $PREV_TAG)" --json number,title --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || echo "")
          else
            PR_LIST=""
          fi

          cat > release-notes.md << 'NOTES'
          ## Quick Start

          ```bash
          docker run -d --name lag \
            -p 3000:3000 \
            -p 7880:7880 \
            -p 7881:7881 \
            -p 50000-50200:50000-50200/udp \
            -v lag_data:/var/lib/postgresql/data \
            -e EXTERNAL_IP=YOUR_SERVER_IP \
            ghcr.io/trylag/lag:${{ github.ref_name }}
          ```

          Open `http://YOUR_SERVER_IP:3000`

          ## Environment Variables

          | Variable | Default | Description |
          |----------|---------|-------------|
          | `EXTERNAL_IP` | `127.0.0.1` | Public IP for voice connections. **Set this to your server's public IP for remote access.** |
          | `SESSION_SECRET` | Auto-generated | Secret for signing session tokens. Auto-generated and persisted to volume on first run. Set to keep tokens valid across image upgrades. |
          | `LAG_VOICE_KEY` | `devkey` | Voice server API key. Change in production. |
          | `LAG_VOICE_SECRET` | `secret` | Voice server API secret. Must be 32+ characters in production. |
          | `DATABASE_URL` | `postgres://postgres@127.0.0.1:5432/lag` | PostgreSQL connection string. Uses bundled PostgreSQL by default. |
          | `API_PORT` | `3001` | Internal API server port. |
          | `PORT` | `3000` | Web UI port. |
          | `VOICE_URL` | `ws://localhost:7880` | Internal voice server WebSocket URL. |
          | `NODE_ENV` | `production` | Node.js environment. |

          ## Ports

          | Port | Protocol | Required | Purpose |
          |------|----------|----------|---------|
          | 3000 | TCP | Yes | Web UI |
          | 7880 | TCP | Yes | Voice signaling |
          | 7881 | TCP | Yes | Voice signaling (TCP fallback) |
          | 50000-50200 | UDP | Yes | Voice media |

          ## Data

          PostgreSQL data persists in the `lag_data` volume.

          ```bash
          # Backup
          docker exec lag su - postgres -c "pg_dump lag" > backup.sql

          # Restore
          docker exec -i lag su - postgres -c "psql lag" < backup.sql
          ```
          NOTES

          if [ -n "$PR_LIST" ]; then
            echo "" >> release-notes.md
            echo "## Changes" >> release-notes.md
            echo "" >> release-notes.md
            echo "$PR_LIST" >> release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
